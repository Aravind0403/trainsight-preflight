[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trainsight"
version = "0.1.0"
description = "Pre-training and post-training data validation CLI for LLM workloads"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
trainsight = "trainsight.cli:app"

[tool.setuptools.packages.find]
include = ["trainsight*"]
